apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms-portal
  template:
    metadata:
      labels:
        app: lms-portal
    spec:
      containers:
      - name: lms-portal
        image: bramag/lms-portal:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lms-portal-service
spec:
  type: NodePort
  selector:
    app: lms-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30021
